<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.06"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <clipPath id="leftZone"><rect x="30" y="30" width="520" height="540"/></clipPath>
  </defs>

  <style>
    /* === Scanline === */
    @keyframes scanline {
      0% { transform: translateY(-2px); opacity: 0; }
      8% { opacity: 0.25; }
      92% { opacity: 0.25; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    /* === Breathing text opacity === */
    @keyframes breathe {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.85; }
    }
    /* === Pulse registration marks === */
    @keyframes pulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    /* === Cursor blink === */
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    /* === Slow float for particles === */
    @keyframes float1 {
      0% { transform: translate(0, 0); opacity: 0; }
      15% { opacity: 0.35; }
      85% { opacity: 0.35; }
      100% { transform: translate(12px, -80px); opacity: 0; }
    }
    @keyframes float2 {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 0.25; }
      80% { opacity: 0.25; }
      100% { transform: translate(-8px, -65px); opacity: 0; }
    }
    @keyframes float3 {
      0% { transform: translate(0, 0); opacity: 0; }
      10% { opacity: 0.2; }
      90% { opacity: 0.2; }
      100% { transform: translate(6px, -90px); opacity: 0; }
    }
    @keyframes float4 {
      0% { transform: translate(0, 0); opacity: 0; }
      25% { opacity: 0.3; }
      75% { opacity: 0.3; }
      100% { transform: translate(-10px, -70px); opacity: 0; }
    }
    /* === Line extend === */
    @keyframes extendLine {
      0% { stroke-dashoffset: 270; }
      40% { stroke-dashoffset: 0; }
      60% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -270; }
    }
    /* === Second scanline (vertical) === */
    @keyframes vscan {
      0% { transform: translateX(-2px); opacity: 0; }
      10% { opacity: 0.12; }
      90% { opacity: 0.12; }
      100% { transform: translateX(1200px); opacity: 0; }
    }
    /* === Data stream text fade === */
    @keyframes dataStream {
      0%, 100% { opacity: 0; }
      5% { opacity: 0.3; }
      15% { opacity: 0.3; }
      20% { opacity: 0; }
    }
    @keyframes dataStream2 {
      0%, 100% { opacity: 0; }
      25% { opacity: 0; }
      30% { opacity: 0.25; }
      40% { opacity: 0.25; }
      45% { opacity: 0; }
    }
    @keyframes dataStream3 {
      0%, 100% { opacity: 0; }
      50% { opacity: 0; }
      55% { opacity: 0.2; }
      65% { opacity: 0.2; }
      70% { opacity: 0; }
    }
    /* === Glow pulse on D1 monogram edge === */
    @keyframes monoGlow {
      0%, 100% { opacity: 0.03; }
      50% { opacity: 0.08; }
    }

    .bg { fill: #0a0a0a; }
    .d1 { fill: #e8e8e8; }
    .scan { animation: scanline 18s linear infinite; fill: #1a1a1a; }
    .vscan { animation: vscan 25s linear infinite; fill: #1a1a1a; }
    .struct { stroke: #1a1a1a; fill: none; }
    .label { fill: #555555; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; animation: breathe 6s ease-in-out infinite; }
    .mono { fill: #555555; font-family: 'Courier New', monospace; animation: breathe 6s ease-in-out infinite; animation-delay: 1s; }
    .atmos { fill: #2a2a2a; font-family: 'Courier New', monospace; }
    .crop { stroke: #222222; fill: none; stroke-width: 0.5; animation: pulse 4s ease-in-out infinite; }
    .cursor { fill: #555555; animation: blink 1s step-end infinite; }
    .particle { fill: #333333; }
    .p1 { animation: float1 12s ease-in-out infinite; }
    .p2 { animation: float2 15s ease-in-out infinite; animation-delay: 3s; }
    .p3 { animation: float3 18s ease-in-out infinite; animation-delay: 7s; }
    .p4 { animation: float4 14s ease-in-out infinite; animation-delay: 5s; }
    .p5 { animation: float1 16s ease-in-out infinite; animation-delay: 9s; }
    .p6 { animation: float2 13s ease-in-out infinite; animation-delay: 2s; }
    .extLine { stroke: #1e1e1e; stroke-width: 0.5; fill: none; stroke-dasharray: 270; animation: extendLine 10s ease-in-out infinite; }
    .data { fill: #1e1e1e; font-family: 'Courier New', monospace; font-size: 8px; letter-spacing: 0.05em; }
    .ds1 { animation: dataStream 12s linear infinite; }
    .ds2 { animation: dataStream2 12s linear infinite; }
    .ds3 { animation: dataStream3 12s linear infinite; }
    .monoEdge { fill: none; stroke: #e8e8e8; stroke-width: 0.5; animation: monoGlow 8s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect class="bg" width="100%" height="100%"/>

  <!-- Noise texture overlay -->
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.4"/>

  <!-- Registration/Crop Marks (pulsing) -->
  <path class="crop" d="M 30 50 L 30 30 L 50 30"/>
  <path class="crop" d="M 1150 30 L 1170 30 L 1170 50" style="animation-delay: 1s"/>
  <path class="crop" d="M 30 550 L 30 570 L 50 570" style="animation-delay: 2s"/>
  <path class="crop" d="M 1150 570 L 1170 570 L 1170 550" style="animation-delay: 3s"/>

  <!-- Center crosshair (subtle) -->
  <line x1="595" y1="290" x2="605" y2="290" stroke="#1a1a1a" stroke-width="0.3" opacity="0.4"/>
  <line x1="600" y1="285" x2="600" y2="295" stroke="#1a1a1a" stroke-width="0.3" opacity="0.4"/>

  <!-- Floating particles in left zone -->
  <g clip-path="url(#leftZone)">
    <circle class="particle p1" cx="120" cy="480" r="1"/>
    <circle class="particle p2" cx="200" cy="520" r="0.8"/>
    <circle class="particle p3" cx="310" cy="490" r="1.2"/>
    <circle class="particle p4" cx="160" cy="510" r="0.6"/>
    <circle class="particle p5" cx="400" cy="470" r="0.9"/>
    <circle class="particle p6" cx="260" cy="530" r="0.7"/>
  </g>

  <!-- Atmosphere Text -->
  <text x="40" y="48" class="atmos" font-size="9" letter-spacing="0.15em">AW26</text>

  <!-- Data stream text (ghostly, cycling) -->
  <text x="40" y="120" class="data ds1">SYS.INIT — 0x7F3A</text>
  <text x="40" y="135" class="data ds2">RENDER.PIPE.ACTIVE</text>
  <text x="40" y="150" class="data ds3">FRAME.LOCK — 60HZ</text>

  <!-- Extending structural line -->
  <line class="extLine" x1="80" y1="365" x2="350" y2="365"/>

  <!-- Typography Left Side (breathing) -->
  <text x="80" y="385" class="label" font-size="11" letter-spacing="0.35em">DIGITAL ATELIER</text>
  <text x="80" y="408" class="mono" font-size="10" letter-spacing="0.2em">EST. 2026</text>

  <!-- Terminal cursor after EST. 2026 -->
  <rect class="cursor" x="193" y="398" width="6" height="10" rx="0.5"/>

  <!-- Vertical measurement scale on far left -->
  <line x1="18" y1="100" x2="18" y2="500" stroke="#151515" stroke-width="0.3"/>
  <line x1="15" y1="100" x2="21" y2="100" stroke="#151515" stroke-width="0.3"/>
  <line x1="15" y1="200" x2="21" y2="200" stroke="#151515" stroke-width="0.3"/>
  <line x1="15" y1="300" x2="21" y2="300" stroke="#151515" stroke-width="0.3"/>
  <line x1="15" y1="400" x2="21" y2="400" stroke="#151515" stroke-width="0.3"/>
  <line x1="15" y1="500" x2="21" y2="500" stroke="#151515" stroke-width="0.3"/>

  <!-- Massive Hero Monogram D1 -->
  <g class="d1">
    <path d="M 610 75 L 760 75 A 225 225 0 0 1 760 525 L 610 525 Z M 665 130 L 665 470 L 760 470 A 170 170 0 0 0 760 130 Z" fill-rule="evenodd"/>
    <path d="M 1060 75 L 1115 75 L 1115 470 L 1150 470 L 1150 525 L 1025 525 L 1025 470 L 1060 470 L 1060 140 L 1010 190 L 1010 125 Z"/>
  </g>

  <!-- Monogram edge glow (extremely subtle) -->
  <path class="monoEdge" d="M 610 75 L 760 75 A 225 225 0 0 1 760 525 L 610 525 Z" stroke-width="1"/>

  <!-- Horizontal scanline -->
  <rect class="scan" x="0" y="0" width="100%" height="1"/>

  <!-- Vertical scanline (slower, dimmer) -->
  <rect class="vscan" x="0" y="0" width="1" height="100%"/>
</svg>
