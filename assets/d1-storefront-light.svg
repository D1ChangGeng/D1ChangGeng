<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <clipPath id="leftZone"><rect x="30" y="30" width="520" height="540"/></clipPath>
    <clipPath id="tw1"><rect class="twClip1" x="60" y="210" width="0" height="22"/></clipPath>
    <clipPath id="tw2"><rect class="twClip2" x="60" y="240" width="0" height="22"/></clipPath>
    <clipPath id="tw3"><rect class="twClip3" x="60" y="270" width="0" height="22"/></clipPath>
  </defs>

  <style>
    @keyframes drawSig{0%{stroke-dashoffset:2800}60%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @keyframes sigFill{0%,55%{fill-opacity:0}80%{fill-opacity:1}100%{fill-opacity:1}}
    @keyframes twReveal1{0%{width:0}12.5%{width:460px}22.9%{width:460px}27.2%{width:0}100%{width:0}}
    @keyframes twOpacity1{0%,1%{opacity:0}1.5%{opacity:1}22.9%{opacity:1}27.1%{opacity:0}100%{opacity:0}}
    @keyframes twReveal2{0%,33.3%{width:0}45.8%{width:460px}56.2%{width:460px}60.5%{width:0}100%{width:0}}
    @keyframes twOpacity2{0%,33.3%{opacity:0}34.8%{opacity:1}56.2%{opacity:1}60.4%{opacity:0}100%{opacity:0}}
    @keyframes twReveal3{0%,66.6%{width:0}79.1%{width:460px}89.6%{width:460px}93.8%{width:0}100%{width:0}}
    @keyframes twOpacity3{0%,66.6%{opacity:0}68.1%{opacity:1}89.6%{opacity:1}93.7%{opacity:0}100%{opacity:0}}
    @keyframes cursorCycle{0%,27.1%{opacity:1;transform:translateY(0)}27.2%,33.2%{opacity:0}33.3%,60.4%{opacity:1;transform:translateY(30px)}60.5%,66.5%{opacity:0}66.6%,93.7%{opacity:1;transform:translateY(60px)}93.8%,100%{opacity:0}}
    @keyframes burst1a{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.5}30%{opacity:0;transform:translate(30px,-15px)}100%{opacity:0}}
    @keyframes burst1b{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.4}31%{opacity:0;transform:translate(-20px,-25px)}100%{opacity:0}}
    @keyframes burst1c{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.4}29%{opacity:0;transform:translate(40px,10px)}100%{opacity:0}}
    @keyframes burst1d{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.3}32%{opacity:0;transform:translate(-15px,20px)}100%{opacity:0}}
    @keyframes burst1e{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.4}28%{opacity:0;transform:translate(25px,-30px)}100%{opacity:0}}
    @keyframes burst1f{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.3}33%{opacity:0;transform:translate(-35px,-8px)}100%{opacity:0}}
    @keyframes burst1g{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.3}30%{opacity:0;transform:translate(18px,25px)}100%{opacity:0}}
    @keyframes burst1h{0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:.4}27%{opacity:0;transform:translate(-28px,15px)}100%{opacity:0}}
    @keyframes burst2a{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.5}63%{opacity:0;transform:translate(35px,-18px)}100%{opacity:0}}
    @keyframes burst2b{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.4}64%{opacity:0;transform:translate(-22px,-28px)}100%{opacity:0}}
    @keyframes burst2c{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.4}62%{opacity:0;transform:translate(42px,12px)}100%{opacity:0}}
    @keyframes burst2d{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.3}65%{opacity:0;transform:translate(-18px,22px)}100%{opacity:0}}
    @keyframes burst2e{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.4}61%{opacity:0;transform:translate(28px,-32px)}100%{opacity:0}}
    @keyframes burst2f{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.3}66%{opacity:0;transform:translate(-38px,-10px)}100%{opacity:0}}
    @keyframes burst2g{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.3}63%{opacity:0;transform:translate(20px,28px)}100%{opacity:0}}
    @keyframes burst2h{0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:.4}60%{opacity:0;transform:translate(-30px,18px)}100%{opacity:0}}
    @keyframes burst3a{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.5}96%{opacity:0;transform:translate(32px,-20px)}100%{opacity:0}}
    @keyframes burst3b{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.4}97%{opacity:0;transform:translate(-25px,-22px)}100%{opacity:0}}
    @keyframes burst3c{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.4}95%{opacity:0;transform:translate(38px,15px)}100%{opacity:0}}
    @keyframes burst3d{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.3}98%{opacity:0;transform:translate(-12px,25px)}100%{opacity:0}}
    @keyframes burst3e{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.4}94%{opacity:0;transform:translate(22px,-28px)}100%{opacity:0}}
    @keyframes burst3f{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.3}99%{opacity:0;transform:translate(-32px,-12px)}100%{opacity:0}}
    @keyframes burst3g{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.3}96%{opacity:0;transform:translate(15px,30px)}100%{opacity:0}}
    @keyframes burst3h{0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:.4}93%{opacity:0;transform:translate(-26px,12px)}100%{opacity:0}}
    @keyframes scanline{0%{transform:translateY(-2px);opacity:0}8%{opacity:.2}92%{opacity:.2}100%{transform:translateY(600px);opacity:0}}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.7}}
    @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
    @keyframes extendLine{0%{stroke-dashoffset:270}40%{stroke-dashoffset:0}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-270}}
    @keyframes vscan{0%{transform:translateX(-2px);opacity:0}10%{opacity:.08}90%{opacity:.08}100%{transform:translateX(1200px);opacity:0}}
    @keyframes monoGlow{0%,100%{opacity:.02}50%{opacity:.06}}
    @keyframes breathe{0%,100%{opacity:.5}50%{opacity:.9}}
    @keyframes float1{0%{transform:translate(0,0);opacity:0}15%{opacity:.25}85%{opacity:.25}100%{transform:translate(12px,-80px);opacity:0}}
    @keyframes float2{0%{transform:translate(0,0);opacity:0}20%{opacity:.2}80%{opacity:.2}100%{transform:translate(-8px,-65px);opacity:0}}
    .bg{fill:#fafafa}.scan{animation:scanline 18s linear infinite;fill:#f0f0f0}.vscan{animation:vscan 25s linear infinite;fill:#f0f0f0}
    .crop{stroke:#dcdcdc;fill:none;stroke-width:.5;animation:pulse 4s ease-in-out infinite}
    .atmos{fill:#d5d5d5;font-family:'Courier New',monospace}
    .extLine{stroke:#e0e0e0;stroke-width:.5;fill:none;stroke-dasharray:270;animation:extendLine 10s ease-in-out infinite}
    .subLabel{fill:#999;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;animation:breathe 6s ease-in-out infinite}
    .subMono{fill:#999;font-family:'Courier New',monospace;animation:breathe 6s ease-in-out infinite;animation-delay:1s}
    .monoEdge{fill:none;stroke:#1a1a1a;stroke-width:.5;animation:monoGlow 8s ease-in-out infinite}
    .particle{fill:#d0d0d0}.p1{animation:float1 12s ease-in-out infinite}.p2{animation:float2 15s ease-in-out infinite;animation-delay:3s}
    .sig{fill:#1a1a1a;fill-opacity:0;stroke:#1a1a1a;stroke-width:2.5;stroke-dasharray:2800;stroke-dashoffset:2800;stroke-linecap:round;stroke-linejoin:round;animation:drawSig 6s cubic-bezier(.4,0,.2,1) forwards,sigFill 6s ease forwards}
    .twText{font-family:'Courier New',monospace;font-size:13px;letter-spacing:.02em}
    .twClip1{animation:twReveal1 24s linear infinite}.twClip2{animation:twReveal2 24s linear infinite}.twClip3{animation:twReveal3 24s linear infinite}
    .tw1{fill:#666;clip-path:url(#tw1);animation:twOpacity1 24s linear infinite}
    .tw2{fill:#666;clip-path:url(#tw2);animation:twOpacity2 24s linear infinite}
    .tw3{fill:#666;clip-path:url(#tw3);animation:twOpacity3 24s linear infinite}
    .twCursor{fill:#666;animation:blink .8s step-end infinite,cursorCycle 24s linear infinite}
    .dp{fill:#666}
    .b1a{animation:burst1a 24s linear infinite}.b1b{animation:burst1b 24s linear infinite}.b1c{animation:burst1c 24s linear infinite}.b1d{animation:burst1d 24s linear infinite}
    .b1e{animation:burst1e 24s linear infinite}.b1f{animation:burst1f 24s linear infinite}.b1g{animation:burst1g 24s linear infinite}.b1h{animation:burst1h 24s linear infinite}
    .b2a{animation:burst2a 24s linear infinite}.b2b{animation:burst2b 24s linear infinite}.b2c{animation:burst2c 24s linear infinite}.b2d{animation:burst2d 24s linear infinite}
    .b2e{animation:burst2e 24s linear infinite}.b2f{animation:burst2f 24s linear infinite}.b2g{animation:burst2g 24s linear infinite}.b2h{animation:burst2h 24s linear infinite}
    .b3a{animation:burst3a 24s linear infinite}.b3b{animation:burst3b 24s linear infinite}.b3c{animation:burst3c 24s linear infinite}.b3d{animation:burst3d 24s linear infinite}
    .b3e{animation:burst3e 24s linear infinite}.b3f{animation:burst3f 24s linear infinite}.b3g{animation:burst3g 24s linear infinite}.b3h{animation:burst3h 24s linear infinite}
  </style>

  <rect class="bg" width="100%" height="100%"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity=".3"/>
  <path class="crop" d="M 30 50 L 30 30 L 50 30"/>
  <path class="crop" d="M 1150 30 L 1170 30 L 1170 50" style="animation-delay:1s"/>
  <path class="crop" d="M 30 550 L 30 570 L 50 570" style="animation-delay:2s"/>
  <path class="crop" d="M 1150 570 L 1170 570 L 1170 550" style="animation-delay:3s"/>
  <line x1="595" y1="290" x2="605" y2="290" stroke="#e8e8e8" stroke-width=".3" opacity=".35"/>
  <line x1="600" y1="285" x2="600" y2="295" stroke="#e8e8e8" stroke-width=".3" opacity=".35"/>
  <g clip-path="url(#leftZone)"><circle class="particle p1" cx="120" cy="480" r="1"/><circle class="particle p2" cx="200" cy="520" r=".8"/></g>
  <text x="40" y="48" class="atmos" font-size="9" letter-spacing=".15em">AW26</text>
  <line x1="18" y1="100" x2="18" y2="500" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="100" x2="21" y2="100" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="200" x2="21" y2="200" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="300" x2="21" y2="300" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="400" x2="21" y2="400" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="500" x2="21" y2="500" stroke="#ececec" stroke-width=".3"/>
  <line class="extLine" x1="60" y1="195" x2="330" y2="195"/>
  <text x="60" y="190" class="subLabel" font-size="9" letter-spacing=".3em">THOUGHTS ON THE AI ERA</text>
  <text class="twText tw1" x="62" y="228">"The best code is the one you never write."</text>
  <text class="twText tw2" x="62" y="258">"Ship the prototype. Kill the roadmap."</text>
  <text class="twText tw3" x="62" y="288">"AI writes code. Humans write intent."</text>
  <rect class="twCursor" x="62" y="218" width="7" height="13" rx=".5"/>
  <g><circle class="dp b1a" cx="120" cy="224" r="1"/><circle class="dp b1b" cx="180" cy="220" r=".8"/><circle class="dp b1c" cx="250" cy="226" r="1.1"/><circle class="dp b1d" cx="310" cy="222" r=".7"/><circle class="dp b1e" cx="160" cy="228" r=".9"/><circle class="dp b1f" cx="350" cy="218" r=".8"/><circle class="dp b1g" cx="220" cy="230" r="1"/><circle class="dp b1h" cx="400" cy="224" r=".6"/></g>
  <g><circle class="dp b2a" cx="120" cy="254" r="1"/><circle class="dp b2b" cx="180" cy="250" r=".8"/><circle class="dp b2c" cx="250" cy="256" r="1.1"/><circle class="dp b2d" cx="310" cy="252" r=".7"/><circle class="dp b2e" cx="160" cy="258" r=".9"/><circle class="dp b2f" cx="350" cy="248" r=".8"/><circle class="dp b2g" cx="220" cy="260" r="1"/><circle class="dp b2h" cx="400" cy="254" r=".6"/></g>
  <g><circle class="dp b3a" cx="120" cy="284" r="1"/><circle class="dp b3b" cx="180" cy="280" r=".8"/><circle class="dp b3c" cx="250" cy="286" r="1.1"/><circle class="dp b3d" cx="310" cy="282" r=".7"/><circle class="dp b3e" cx="160" cy="288" r=".9"/><circle class="dp b3f" cx="350" cy="278" r=".8"/><circle class="dp b3g" cx="220" cy="290" r="1"/><circle class="dp b3h" cx="400" cy="284" r=".6"/></g>
  <text x="60" y="530" class="subLabel" font-size="10" letter-spacing=".35em">DIGITAL ATELIER</text>
  <text x="60" y="550" class="subMono" font-size="9" letter-spacing=".2em">EST. 2026</text>
  <g transform="translate(680, 80) scale(3.2)">
    <path class="sig" d="M 12,120 C 12,120 10,10 50,8 C 90,6 120,25 125,60 C 130,95 105,125 70,130 C 50,133 25,128 12,120 Z M 40,40 C 55,38 75,45 78,65 C 81,85 68,100 50,102 C 38,103 28,98 25,85 C 22,72 30,42 40,40 M 140,15 L 138,10 L 148,10 L 142,35 L 142,120 L 155,120 L 155,128 L 128,128 L 128,120 L 138,120 L 138,35 L 130,42 L 128,38 Z"/>
  </g>
  <path class="monoEdge" d="M 718 336 A 200 200 0 0 1 718 496" stroke-width="1"/>
  <rect class="scan" x="0" y="0" width="100%" height="1"/>
  <rect class="vscan" x="0" y="0" width="1" height="100%"/>
</svg>
