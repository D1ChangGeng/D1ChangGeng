<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>

  <style>
    /* ============================== */
    /*  INSIGHT CYCLE: 32s total      */
    /*  4 insights x 8s each          */
    /*  Each: 0-2.5s assemble         */
    /*        2.5-5.5s hold           */
    /*        5.5-7s dissolve         */
    /*        7-8s empty              */
    /* ============================== */

    /* Insight visibility (opacity in/out) */
    @keyframes ins1 {
      0%{opacity:0} 3%{opacity:0} 5%{opacity:1} 18%{opacity:1} 22%{opacity:0} 100%{opacity:0}
    }
    @keyframes ins2 {
      0%{opacity:0} 28%{opacity:0} 30%{opacity:1} 43%{opacity:1} 47%{opacity:0} 100%{opacity:0}
    }
    @keyframes ins3 {
      0%{opacity:0} 53%{opacity:0} 55%{opacity:1} 68%{opacity:1} 72%{opacity:0} 100%{opacity:0}
    }
    @keyframes ins4 {
      0%{opacity:0} 78%{opacity:0} 80%{opacity:1} 93%{opacity:1} 97%{opacity:0} 100%{opacity:0}
    }

    /* Particle ASSEMBLE: scattered → converge to origin */
    @keyframes pa1{0%{transform:translate(45,-30);opacity:0}4%{opacity:.6}8%{transform:translate(0,0);opacity:.7}10%{opacity:0}100%{opacity:0}}
    @keyframes pa2{0%{transform:translate(-35,40);opacity:0}4%{opacity:.5}8%{transform:translate(0,0);opacity:.6}10%{opacity:0}100%{opacity:0}}
    @keyframes pa3{0%{transform:translate(55,25);opacity:0}4%{opacity:.5}8%{transform:translate(0,0);opacity:.6}10%{opacity:0}100%{opacity:0}}
    @keyframes pa4{0%{transform:translate(-50,-35);opacity:0}4%{opacity:.4}8%{transform:translate(0,0);opacity:.5}10%{opacity:0}100%{opacity:0}}
    @keyframes pa5{0%{transform:translate(30,45);opacity:0}4%{opacity:.5}8%{transform:translate(0,0);opacity:.5}10%{opacity:0}100%{opacity:0}}
    @keyframes pa6{0%{transform:translate(-40,-20);opacity:0}4%{opacity:.6}8%{transform:translate(0,0);opacity:.6}10%{opacity:0}100%{opacity:0}}

    /* Particle DISSOLVE: origin → scatter outward */
    @keyframes pd1{0%{opacity:0}20%{opacity:0;transform:translate(0,0)}22%{opacity:.7}28%{opacity:0;transform:translate(50,-35)}100%{opacity:0}}
    @keyframes pd2{0%{opacity:0}20%{opacity:0;transform:translate(0,0)}22%{opacity:.6}29%{opacity:0;transform:translate(-40,30)}100%{opacity:0}}
    @keyframes pd3{0%{opacity:0}20%{opacity:0;transform:translate(0,0)}22%{opacity:.5}27%{opacity:0;transform:translate(60,20)}100%{opacity:0}}
    @keyframes pd4{0%{opacity:0}20%{opacity:0;transform:translate(0,0)}22%{opacity:.6}30%{opacity:0;transform:translate(-55,-25)}100%{opacity:0}}
    @keyframes pd5{0%{opacity:0}20%{opacity:0;transform:translate(0,0)}22%{opacity:.5}26%{opacity:0;transform:translate(35,40)}100%{opacity:0}}
    @keyframes pd6{0%{opacity:0}20%{opacity:0;transform:translate(0,0)}22%{opacity:.4}31%{opacity:0;transform:translate(-30,-40)}100%{opacity:0}}

    /* Ambient */
    @keyframes scanline{0%{transform:translateY(-2);opacity:0}8%{opacity:.2}92%{opacity:.2}100%{transform:translateY(600);opacity:0}}
    @keyframes vscan{0%{transform:translateX(-2);opacity:0}10%{opacity:.1}90%{opacity:.1}100%{transform:translateX(1200);opacity:0}}
    @keyframes pulse{0%,100%{opacity:.3}50%{opacity:.75}}
    @keyframes breathe{0%,100%{opacity:.4}50%{opacity:.8}}
    @keyframes extendLine{0%{stroke-dashoffset:270}40%{stroke-dashoffset:0}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-270}}
    @keyframes drawSig{0%{stroke-dashoffset:3200}55%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
    @keyframes sigFill{0%,50%{fill-opacity:0}75%{fill-opacity:1}100%{fill-opacity:1}}

    /* Base */
    .bg{fill:#fafafa}
    .scan{animation:scanline 18s linear infinite;fill:#1a1a1a}
    .vscan{animation:vscan 25s linear infinite;fill:#1a1a1a}
    .crop{stroke:#dcdcdc;fill:none;stroke-width:.5;animation:pulse 4s ease-in-out infinite}
    .atmos{fill:#d5d5d5;font-family:'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace}
    .extLine{stroke:#e0e0e0;stroke-width:.5;fill:none;stroke-dasharray:270;animation:extendLine 10s ease-in-out infinite}
    .subLabel{fill:#555;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:300;animation:breathe 6s ease-in-out infinite}
    .subMono{fill:#555;font-family:'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace;font-size:9px;animation:breathe 6s ease-in-out infinite;animation-delay:1s}

    /* Insight text */
    .iFont{font-family:'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace;font-size:15px;fill:#555;letter-spacing:.01em}
    .iSub{font-family:'JetBrains Mono','Fira Code','SF Mono','Courier New',monospace;font-size:11px;fill:#555;letter-spacing:.02em}
    .iAttr{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:9px;fill:#bbb;letter-spacing:.15em;font-weight:300}
    .i1{animation:ins1 32s linear infinite}
    .i2{animation:ins2 32s linear infinite}
    .i3{animation:ins3 32s linear infinite}
    .i4{animation:ins4 32s linear infinite}

    /* Assemble particles per insight */
    .ap{fill:#aaa}
    .a1a{animation:pa1 32s linear infinite}.a1b{animation:pa2 32s linear infinite}.a1c{animation:pa3 32s linear infinite}
    .a1d{animation:pa4 32s linear infinite}.a1e{animation:pa5 32s linear infinite}.a1f{animation:pa6 32s linear infinite}
    .a2a{animation:pa1 32s linear infinite;animation-delay:8s}.a2b{animation:pa2 32s linear infinite;animation-delay:8s}.a2c{animation:pa3 32s linear infinite;animation-delay:8s}
    .a2d{animation:pa4 32s linear infinite;animation-delay:8s}.a2e{animation:pa5 32s linear infinite;animation-delay:8s}.a2f{animation:pa6 32s linear infinite;animation-delay:8s}
    .a3a{animation:pa1 32s linear infinite;animation-delay:16s}.a3b{animation:pa2 32s linear infinite;animation-delay:16s}.a3c{animation:pa3 32s linear infinite;animation-delay:16s}
    .a3d{animation:pa4 32s linear infinite;animation-delay:16s}.a3e{animation:pa5 32s linear infinite;animation-delay:16s}.a3f{animation:pa6 32s linear infinite;animation-delay:16s}
    .a4a{animation:pa1 32s linear infinite;animation-delay:24s}.a4b{animation:pa2 32s linear infinite;animation-delay:24s}.a4c{animation:pa3 32s linear infinite;animation-delay:24s}
    .a4d{animation:pa4 32s linear infinite;animation-delay:24s}.a4e{animation:pa5 32s linear infinite;animation-delay:24s}.a4f{animation:pa6 32s linear infinite;animation-delay:24s}

    /* Dissolve particles per insight */
    .dp{fill:#aaa}
    .d1a{animation:pd1 32s linear infinite}.d1b{animation:pd2 32s linear infinite}.d1c{animation:pd3 32s linear infinite}
    .d1d{animation:pd4 32s linear infinite}.d1e{animation:pd5 32s linear infinite}.d1f{animation:pd6 32s linear infinite}
    .d2a{animation:pd1 32s linear infinite;animation-delay:8s}.d2b{animation:pd2 32s linear infinite;animation-delay:8s}.d2c{animation:pd3 32s linear infinite;animation-delay:8s}
    .d2d{animation:pd4 32s linear infinite;animation-delay:8s}.d2e{animation:pd5 32s linear infinite;animation-delay:8s}.d2f{animation:pd6 32s linear infinite;animation-delay:8s}
    .d3a{animation:pd1 32s linear infinite;animation-delay:16s}.d3b{animation:pd2 32s linear infinite;animation-delay:16s}.d3c{animation:pd3 32s linear infinite;animation-delay:16s}
    .d3d{animation:pd4 32s linear infinite;animation-delay:16s}.d3e{animation:pd5 32s linear infinite;animation-delay:16s}.d3f{animation:pd6 32s linear infinite;animation-delay:16s}
    .d4a{animation:pd1 32s linear infinite;animation-delay:24s}.d4b{animation:pd2 32s linear infinite;animation-delay:24s}.d4c{animation:pd3 32s linear infinite;animation-delay:24s}
    .d4d{animation:pd4 32s linear infinite;animation-delay:24s}.d4e{animation:pd5 32s linear infinite;animation-delay:24s}.d4f{animation:pd6 32s linear infinite;animation-delay:24s}

    /* Signature — filled calligraphic path (variable width = real pen feel) */
    .sig{fill:#1a1a1a;fill-opacity:0;stroke:#1a1a1a;stroke-width:1.5;stroke-dasharray:3500;stroke-dashoffset:3500;stroke-linecap:round;stroke-linejoin:round;animation:drawSig 5s cubic-bezier(.25,.1,.25,1) forwards,sigFill 5s ease forwards}
    .sigBody{fill:#1a1a1a;opacity:0;animation:sigFill 5s ease forwards}
    .monoEdge{fill:none;stroke:#1a1a1a;stroke-width:.4;animation:pulse 8s ease-in-out infinite}
  </style>

  <!-- Background + noise -->
  <rect class="bg" width="100%" height="100%"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity=".3"/>

  <!-- Crop marks -->
  <path class="crop" d="M 30 50 L 30 30 L 50 30"/>
  <path class="crop" d="M 1150 30 L 1170 30 L 1170 50" style="animation-delay:1s"/>
  <path class="crop" d="M 30 550 L 30 570 L 50 570" style="animation-delay:2s"/>
  <path class="crop" d="M 1150 570 L 1170 570 L 1170 550" style="animation-delay:3s"/>

  <!-- Atmosphere -->
  <text x="40" y="48" class="atmos" font-size="9" letter-spacing=".15em">AW26</text>

  <!-- Measurement scale -->
  <line x1="18" y1="100" x2="18" y2="500" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="100" x2="21" y2="100" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="200" x2="21" y2="200" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="300" x2="21" y2="300" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="400" x2="21" y2="400" stroke="#ececec" stroke-width=".3"/>
  <line x1="15" y1="500" x2="21" y2="500" stroke="#ececec" stroke-width=".3"/>

  <!-- Center crosshair -->
  <line x1="293" y1="298" x2="307" y2="298" stroke="#e8e8e8" stroke-width=".3" opacity=".3"/>
  <line x1="300" y1="291" x2="300" y2="305" stroke="#e8e8e8" stroke-width=".3" opacity=".3"/>

  <!-- Section label -->
  <line class="extLine" x1="60" y1="200" x2="330" y2="200"/>
  <text x="60" y="195" class="subLabel" font-size="8" letter-spacing=".35em">REFLECTIONS ON THE AI ERA</text>

  <!-- ============================================ -->
  <!--  INSIGHT 1: Karpathy — vibe coding           -->
  <!-- ============================================ -->
  <g class="i1">
    <text class="iFont" x="75" y="260">Forget the code exists.</text>
    <text class="iFont" x="75" y="280">Give in to the vibes, embrace</text>
    <text class="iFont" x="75" y="300">exponentials. See stuff, say stuff,</text>
    <text class="iFont" x="75" y="320">run stuff. It mostly works.</text>
    <text class="iAttr" x="75" y="348">— ANDREJ KARPATHY</text>
  </g>
  <!-- Assemble particles I1 -->
  <circle class="ap a1a" cx="130" cy="270" r="1.2"/><circle class="ap a1b" cx="250" cy="285" r="1"/>
  <circle class="ap a1c" cx="370" cy="265" r="1.1"/><circle class="ap a1d" cx="180" cy="310" r=".9"/>
  <circle class="ap a1e" cx="310" cy="330" r="1"/><circle class="ap a1f" cx="420" cy="295" r=".8"/>
  <!-- Dissolve particles I1 -->
  <circle class="dp d1a" cx="200" cy="280" r="1.2"/><circle class="dp d1b" cx="340" cy="270" r="1"/>
  <circle class="dp d1c" cx="150" cy="310" r="1.1"/><circle class="dp d1d" cx="400" cy="295" r=".9"/>
  <circle class="dp d1e" cx="270" cy="340" r="1"/><circle class="dp d1f" cx="100" cy="260" r=".8"/>

  <!-- ============================================ -->
  <!--  INSIGHT 2: Willison — context engineering    -->
  <!-- ============================================ -->
  <g class="i2">
    <text class="iFont" x="75" y="260">The craft of AI-driven development</text>
    <text class="iFont" x="75" y="280">is context engineering. Every token</text>
    <text class="iFont" x="75" y="300">in the window shapes behavior.</text>
    <text class="iFont" x="75" y="320">Prune ruthlessly. Add with intent.</text>
    <text class="iAttr" x="75" y="348">— SIMON WILLISON</text>
  </g>
  <circle class="ap a2a" cx="130" cy="270" r="1.2"/><circle class="ap a2b" cx="250" cy="285" r="1"/>
  <circle class="ap a2c" cx="370" cy="265" r="1.1"/><circle class="ap a2d" cx="180" cy="310" r=".9"/>
  <circle class="ap a2e" cx="310" cy="330" r="1"/><circle class="ap a2f" cx="420" cy="295" r=".8"/>
  <circle class="dp d2a" cx="200" cy="280" r="1.2"/><circle class="dp d2b" cx="340" cy="270" r="1"/>
  <circle class="dp d2c" cx="150" cy="310" r="1.1"/><circle class="dp d2d" cx="400" cy="295" r=".9"/>
  <circle class="dp d2e" cx="270" cy="340" r="1"/><circle class="dp d2f" cx="100" cy="260" r=".8"/>

  <!-- ============================================ -->
  <!--  INSIGHT 3: spec-driven development           -->
  <!-- ============================================ -->
  <g class="i3">
    <text class="iFont" x="75" y="260">If the prompt is not testable,</text>
    <text class="iFont" x="75" y="280">it is not a specification.</text>
    <text class="iFont" x="75" y="300">The harness iterates. The model</text>
    <text class="iFont" x="75" y="320">compiles intent into execution.</text>
    <text class="iAttr" x="75" y="348">— SPEC-DRIVEN DEVELOPMENT</text>
  </g>
  <circle class="ap a3a" cx="130" cy="270" r="1.2"/><circle class="ap a3b" cx="250" cy="285" r="1"/>
  <circle class="ap a3c" cx="370" cy="265" r="1.1"/><circle class="ap a3d" cx="180" cy="310" r=".9"/>
  <circle class="ap a3e" cx="310" cy="330" r="1"/><circle class="ap a3f" cx="420" cy="295" r=".8"/>
  <circle class="dp d3a" cx="200" cy="280" r="1.2"/><circle class="dp d3b" cx="340" cy="270" r="1"/>
  <circle class="dp d3c" cx="150" cy="310" r="1.1"/><circle class="dp d3d" cx="400" cy="295" r=".9"/>
  <circle class="dp d3e" cx="270" cy="340" r="1"/><circle class="dp d3f" cx="100" cy="260" r=".8"/>

  <!-- ============================================ -->
  <!--  INSIGHT 4: the new role                      -->
  <!-- ============================================ -->
  <g class="i4">
    <text class="iFont" x="75" y="260">Stop calling yourself a coder.</text>
    <text class="iFont" x="75" y="280">You are the architect now.</text>
    <text class="iFont" x="75" y="300">The frontier model is your crew.</text>
    <text class="iFont" x="75" y="320">Ship constraints, not keystrokes.</text>
    <text class="iAttr" x="75" y="348">— THE BUILDER MANIFESTO</text>
  </g>
  <circle class="ap a4a" cx="130" cy="270" r="1.2"/><circle class="ap a4b" cx="250" cy="285" r="1"/>
  <circle class="ap a4c" cx="370" cy="265" r="1.1"/><circle class="ap a4d" cx="180" cy="310" r=".9"/>
  <circle class="ap a4e" cx="310" cy="330" r="1"/><circle class="ap a4f" cx="420" cy="295" r=".8"/>
  <circle class="dp d4a" cx="200" cy="280" r="1.2"/><circle class="dp d4b" cx="340" cy="270" r="1"/>
  <circle class="dp d4c" cx="150" cy="310" r="1.1"/><circle class="dp d4d" cx="400" cy="295" r=".9"/>
  <circle class="dp d4e" cx="270" cy="340" r="1"/><circle class="dp d4f" cx="100" cy="260" r=".8"/>

  <!-- Bottom labels -->
  <text x="60" y="530" class="subLabel" font-size="10" letter-spacing=".35em">DIGITAL ATELIER</text>
  <text x="60" y="550" class="subMono" letter-spacing=".2em">EST. 2026</text>

  <!-- ============================================ -->
  <!--  RIGHT: CALLIGRAPHIC SIGNATURE               -->
  <!--  "D1" as drawn path + "ChangGeng" as script   -->
  <!-- ============================================ -->
  <g transform="translate(620, 90) scale(3.5)">
    <!-- D: flowing calligraphic with open counter -->
    <path class="sig" fill-rule="evenodd" d="
      M 8,95
      C 8,80 8,30 12,18
      C 16,6 24,2 38,2
      C 52,2 68,8 80,22
      C 92,36 98,56 98,72
      C 98,88 92,100 80,108
      C 68,116 52,118 38,116
      C 24,114 14,106 10,98
      L 8,95 Z
      M 22,82
      C 24,90 32,96 42,98
      C 52,100 64,96 72,88
      C 80,80 84,68 84,56
      C 84,44 80,32 72,24
      C 64,16 52,12 42,14
      C 32,16 26,24 24,36
      C 22,48 22,66 22,82 Z
    "/>
    <!-- 1: elegant with calligraphic flag -->
    <path class="sig" d="
      M 118,8 C 120,4 122,2 126,2 L 130,2 C 132,2 132,4 130,8
      L 128,18 L 128,96 C 128,98 130,100 134,100 L 144,100
      C 146,100 146,102 146,104 L 146,106 C 146,108 144,108 142,108
      L 114,108 C 112,108 112,106 112,104 L 112,102 C 112,100 114,100 116,100
      L 124,100 C 126,100 126,98 126,96 L 126,26
      L 116,34 C 114,36 112,34 112,32 L 118,8 Z
    "/>
  </g>
  <!-- "ChangGeng" in flowing script below D1 -->
  <text x="780" y="510" fill="#1a1a1a" opacity="0"
    font-family="'Snell Roundhand','Segoe Script','Apple Chancery','Lucida Handwriting',cursive"
    font-size="42" font-style="italic" letter-spacing=".02em"
    style="animation: sigFill 5s ease forwards; animation-delay: 2.5s">ChangGeng</text>

  <!-- Subtle signature underline flourish -->
  <line x1="680" y1="535" x2="1130" y2="535" stroke="#e0e0e0" stroke-width=".5" opacity=".2"/>
  <path fill="none" stroke="#e0e0e0" stroke-width=".4" opacity=".15"
    d="M 1130,535 C 1135,535 1140,530 1140,525"/>


  <!-- Monogram edge accent -->
  <path class="monoEdge" d="M 1082 290 L 1082 520"/>

  <!-- Scanlines -->
  <rect class="scan" x="0" y="0" width="100%" height="1"/>
  <rect class="vscan" x="0" y="0" width="1" height="100%"/>
</svg>
