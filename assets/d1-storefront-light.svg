<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <style>
    @keyframes scanline {
      0% { transform: translateY(-2px); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(600px); opacity: 0; }
    }
    .scan {
      animation: scanline 20s linear infinite;
      fill: #f0f0f0;
    }
    .bg { fill: #fafafa; }
    .d1 { fill: #1a1a1a; }
    .label { fill: #999999; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; }
    .mono { fill: #999999; font-family: 'Courier New', monospace; }
    .atmos { fill: #d5d5d5; font-family: 'Courier New', monospace; }
    .struct { stroke: #e8e8e8; }
  </style>
  
  <rect class="bg" width="100%" height="100%" />
  
  <!-- Registration/Crop Marks -->
  <path class="struct" d="M 30 45 L 30 30 L 45 30 M 1155 30 L 1170 30 L 1170 45 M 30 555 L 30 570 L 45 570 M 1155 570 L 1170 570 L 1170 555" fill="none" stroke-width="0.5" />
  
  <!-- Atmosphere Text -->
  <text x="40" y="45" class="atmos" font-size="9" letter-spacing="0.15em">AW26</text>
  
  <!-- Structural Line -->
  <line x1="80" y1="365" x2="350" y2="365" class="struct" stroke-width="0.5" />
  
  <!-- Typography Left Side -->
  <text x="80" y="380" class="label" font-size="11" letter-spacing="0.35em">DIGITAL ATELIER</text>
  <text x="80" y="400" class="mono" font-size="10" letter-spacing="0.2em">EST. 2026</text>
  
  <!-- Massive Hero Monogram D1 -->
  <g class="d1">
    <path d="M 610 75 L 760 75 A 225 225 0 0 1 760 525 L 610 525 Z M 665 130 L 665 470 L 760 470 A 170 170 0 0 0 760 130 Z" fill-rule="evenodd" />
    <path d="M 1060 75 L 1115 75 L 1115 470 L 1150 470 L 1150 525 L 1025 525 L 1025 470 L 1060 470 L 1060 140 L 1010 190 L 1010 125 Z" />
  </g>
  
  <!-- Animation Layer -->
  <rect class="scan" x="0" y="0" width="100%" height="1" />
</svg>