<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <clipPath id="leftZone"><rect x="30" y="30" width="520" height="540"/></clipPath>
    <!-- Typewriter clip masks — larger text area -->
    <clipPath id="tw1"><rect class="twClip1" x="55" y="205" width="0" height="30"/></clipPath>
    <clipPath id="tw2"><rect class="twClip2" x="55" y="250" width="0" height="30"/></clipPath>
    <clipPath id="tw3"><rect class="twClip3" x="55" y="295" width="0" height="30"/></clipPath>
  </defs>

  <style>
    /* ======================== */
    /* SIGNATURE STROKE DRAW    */
    /* ======================== */
    @keyframes drawSig {
      0% { stroke-dashoffset: 2800; }
      60% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes sigFill {
      0%, 55% { fill-opacity: 0; }
      80% { fill-opacity: 1; }
      100% { fill-opacity: 1; }
    }

    /* ======================== */
    /* TYPEWRITER CLIP EXPAND   */
    /* ======================== */
    /* Total cycle: 24s = 3 insights x 8s each */
    /* Each insight: 0-3s type in, 3-5.5s hold, 5.5-6.5s dissolve, 6.5-8s empty */

    /* Insight 1: 0s - 8s */
    @keyframes twReveal1 {
      0% { width: 0; }
      12.5% { width: 520px; }
      22.9% { width: 520px; }
      27.1% { width: 520px; }
      27.2% { width: 0; }
      100% { width: 0; }
    }
    @keyframes twOpacity1 {
      0%, 1% { opacity: 0; } 1.5% { opacity: 1; }
      22.9% { opacity: 1; }
      27.1% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Insight 2: 8s - 16s → delay offsets: 33.3% - 66.6% */
    @keyframes twReveal2 {
      0%, 33.3% { width: 0; }
      45.8% { width: 520px; }
      56.2% { width: 520px; }
      60.4% { width: 520px; }
      60.5% { width: 0; }
      100% { width: 0; }
    }
    @keyframes twOpacity2 {
      0%, 33.3% { opacity: 0; } 34.8% { opacity: 1; }
      56.2% { opacity: 1; }
      60.4% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Insight 3: 16s - 24s → delay offsets: 66.6% - 100% */
    @keyframes twReveal3 {
      0%, 66.6% { width: 0; }
      79.1% { width: 520px; }
      89.6% { width: 520px; }
      93.7% { width: 520px; }
      93.8% { width: 0; }
      100% { width: 0; }
    }
    @keyframes twOpacity3 {
      0%, 66.6% { opacity: 0; } 68.1% { opacity: 1; }
      89.6% { opacity: 1; }
      93.7% { opacity: 0; }
      100% { opacity: 0; }
    }

    /* Cursor tracks typewriter horizontally + jumps between lines */
    @keyframes cursorCycle {
      /* Insight 1: type in (0-12.5%), hold (12.5-22.9%), fade (22.9-27.1%) */
      0%    { transform: translate(0, 0); opacity: 1; }
      1%    { transform: translate(0, 0); opacity: 1; }
      12.5% { transform: translate(370px, 0); opacity: 1; }
      22.9% { transform: translate(370px, 0); opacity: 1; }
      27.1% { transform: translate(370px, 0); opacity: 0; }
      /* Gap */
      27.2% { transform: translate(0, 45px); opacity: 0; }
      33.2% { transform: translate(0, 45px); opacity: 0; }
      /* Insight 2: type in (33.3-45.8%), hold (45.8-56.2%), fade (56.2-60.4%) */
      33.3% { transform: translate(0, 45px); opacity: 1; }
      45.8% { transform: translate(310px, 45px); opacity: 1; }
      56.2% { transform: translate(310px, 45px); opacity: 1; }
      60.4% { transform: translate(310px, 45px); opacity: 0; }
      /* Gap */
      60.5% { transform: translate(0, 90px); opacity: 0; }
      66.5% { transform: translate(0, 90px); opacity: 0; }
      /* Insight 3: type in (66.6-79.1%), hold (79.1-89.6%), fade (89.6-93.7%) */
      66.6% { transform: translate(0, 90px); opacity: 1; }
      79.1% { transform: translate(250px, 90px); opacity: 1; }
      89.6% { transform: translate(250px, 90px); opacity: 1; }
      93.7% { transform: translate(250px, 90px); opacity: 0; }
      /* Reset gap */
      93.8% { transform: translate(0, 0); opacity: 0; }
      100%  { transform: translate(0, 0); opacity: 0; }
    }

    /* ======================== */
    /* PARTICLE DISSOLVE BURSTS */
    /* ======================== */
    /* Burst 1: fires at ~24% (insight 1 dissolve) */
    @keyframes burst1a { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.6}30%{opacity:0;transform:translate(30px,-15px)}100%{opacity:0} }
    @keyframes burst1b { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.5}31%{opacity:0;transform:translate(-20px,-25px)}100%{opacity:0} }
    @keyframes burst1c { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.5}29%{opacity:0;transform:translate(40px,10px)}100%{opacity:0} }
    @keyframes burst1d { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.4}32%{opacity:0;transform:translate(-15px,20px)}100%{opacity:0} }
    @keyframes burst1e { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.5}28%{opacity:0;transform:translate(25px,-30px)}100%{opacity:0} }
    @keyframes burst1f { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.3}33%{opacity:0;transform:translate(-35px,-8px)}100%{opacity:0} }
    @keyframes burst1g { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.4}30%{opacity:0;transform:translate(18px,25px)}100%{opacity:0} }
    @keyframes burst1h { 0%,22%{opacity:0;transform:translate(0,0)}24%{opacity:0.5}27%{opacity:0;transform:translate(-28px,15px)}100%{opacity:0} }

    /* Burst 2: fires at ~57% (insight 2 dissolve) */
    @keyframes burst2a { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.6}63%{opacity:0;transform:translate(35px,-18px)}100%{opacity:0} }
    @keyframes burst2b { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.5}64%{opacity:0;transform:translate(-22px,-28px)}100%{opacity:0} }
    @keyframes burst2c { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.5}62%{opacity:0;transform:translate(42px,12px)}100%{opacity:0} }
    @keyframes burst2d { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.4}65%{opacity:0;transform:translate(-18px,22px)}100%{opacity:0} }
    @keyframes burst2e { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.5}61%{opacity:0;transform:translate(28px,-32px)}100%{opacity:0} }
    @keyframes burst2f { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.3}66%{opacity:0;transform:translate(-38px,-10px)}100%{opacity:0} }
    @keyframes burst2g { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.4}63%{opacity:0;transform:translate(20px,28px)}100%{opacity:0} }
    @keyframes burst2h { 0%,55%{opacity:0;transform:translate(0,0)}57%{opacity:0.5}60%{opacity:0;transform:translate(-30px,18px)}100%{opacity:0} }

    /* Burst 3: fires at ~90% (insight 3 dissolve) */
    @keyframes burst3a { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.6}96%{opacity:0;transform:translate(32px,-20px)}100%{opacity:0} }
    @keyframes burst3b { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.5}97%{opacity:0;transform:translate(-25px,-22px)}100%{opacity:0} }
    @keyframes burst3c { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.5}95%{opacity:0;transform:translate(38px,15px)}100%{opacity:0} }
    @keyframes burst3d { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.4}98%{opacity:0;transform:translate(-12px,25px)}100%{opacity:0} }
    @keyframes burst3e { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.5}94%{opacity:0;transform:translate(22px,-28px)}100%{opacity:0} }
    @keyframes burst3f { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.3}99%{opacity:0;transform:translate(-32px,-12px)}100%{opacity:0} }
    @keyframes burst3g { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.4}96%{opacity:0;transform:translate(15px,30px)}100%{opacity:0} }
    @keyframes burst3h { 0%,88%{opacity:0;transform:translate(0,0)}90%{opacity:0.5}93%{opacity:0;transform:translate(-26px,12px)}100%{opacity:0} }

    /* ======================== */
    /* INHERITED AMBIENT ANIMS  */
    /* ======================== */
    @keyframes scanline { 0%{transform:translateY(-2px);opacity:0}8%{opacity:0.2}92%{opacity:0.2}100%{transform:translateY(600px);opacity:0} }
    @keyframes pulse { 0%,100%{opacity:0.3}50%{opacity:0.8} }
    @keyframes blink { 0%,49%{opacity:1}50%,100%{opacity:0} }
    @keyframes extendLine { 0%{stroke-dashoffset:270}40%{stroke-dashoffset:0}60%{stroke-dashoffset:0}100%{stroke-dashoffset:-270} }
    @keyframes vscan { 0%{transform:translateX(-2px);opacity:0}10%{opacity:0.08}90%{opacity:0.08}100%{transform:translateX(1200px);opacity:0} }
    @keyframes monoGlow { 0%,100%{opacity:0.03}50%{opacity:0.08} }
    @keyframes breathe { 0%,100%{opacity:0.45}50%{opacity:0.85} }
    @keyframes float1 { 0%{transform:translate(0,0);opacity:0}15%{opacity:0.35}85%{opacity:0.35}100%{transform:translate(12px,-80px);opacity:0} }
    @keyframes float2 { 0%{transform:translate(0,0);opacity:0}20%{opacity:0.2}80%{opacity:0.2}100%{transform:translate(-8px,-65px);opacity:0} }

    /* ======================== */
    /* BASE STYLES              */
    /* ======================== */
    .bg { fill: #fafafa; }
    .scan { animation: scanline 18s linear infinite; fill: #f0f0f0; }
    .vscan { animation: vscan 25s linear infinite; fill: #f0f0f0; }
    .crop { stroke: #dcdcdc; fill: none; stroke-width: 0.5; animation: pulse 4s ease-in-out infinite; }
    .atmos { fill: #d5d5d5; font-family: 'Courier New', monospace; }
    .extLine { stroke: #e0e0e0; stroke-width: 0.5; fill: none; stroke-dasharray: 270; animation: extendLine 10s ease-in-out infinite; }
    .subLabel { fill: #999999; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 300; animation: breathe 6s ease-in-out infinite; }
    .subMono { fill: #999999; font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', monospace; animation: breathe 6s ease-in-out infinite; animation-delay: 1s; }
    .monoEdge { fill: none; stroke: #1a1a1a; stroke-width: 0.5; animation: monoGlow 8s ease-in-out infinite; }
    .particle { fill: #d0d0d0; }
    .p1 { animation: float1 12s ease-in-out infinite; }
    .p2 { animation: float2 15s ease-in-out infinite; animation-delay: 3s; }

    /* Signature D1 */
    .sig {
      fill: #1a1a1a; fill-opacity: 0;
      stroke: #1a1a1a; stroke-width: 2;
      stroke-dasharray: 2800; stroke-dashoffset: 2800;
      stroke-linecap: round; stroke-linejoin: round;
      animation: drawSig 5s cubic-bezier(0.25,0.1,0.25,1) forwards, sigFill 5s ease forwards;
    }

    /* Typewriter text */
    .twText { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'Courier New', monospace; font-size: 17px; letter-spacing: 0.01em; font-weight: 400; }
    .twClip1 { animation: twReveal1 24s linear infinite; }
    .twClip2 { animation: twReveal2 24s linear infinite; }
    .twClip3 { animation: twReveal3 24s linear infinite; }
    .tw1 { fill: #666666; clip-path: url(#tw1); animation: twOpacity1 24s linear infinite; }
    .tw2 { fill: #666666; clip-path: url(#tw2); animation: twOpacity2 24s linear infinite; }
    .tw3 { fill: #666666; clip-path: url(#tw3); animation: twOpacity3 24s linear infinite; }

    /* Typewriter cursor */
    .twCursor { fill: #666666; animation: blink 0.8s step-end infinite, cursorCycle 24s linear infinite; width: 9px; height: 17px; }

    /* Dissolve particles */
    .dp { fill: #666666; }
    .b1a{animation:burst1a 24s linear infinite}.b1b{animation:burst1b 24s linear infinite}.b1c{animation:burst1c 24s linear infinite}.b1d{animation:burst1d 24s linear infinite}
    .b1e{animation:burst1e 24s linear infinite}.b1f{animation:burst1f 24s linear infinite}.b1g{animation:burst1g 24s linear infinite}.b1h{animation:burst1h 24s linear infinite}
    .b2a{animation:burst2a 24s linear infinite}.b2b{animation:burst2b 24s linear infinite}.b2c{animation:burst2c 24s linear infinite}.b2d{animation:burst2d 24s linear infinite}
    .b2e{animation:burst2e 24s linear infinite}.b2f{animation:burst2f 24s linear infinite}.b2g{animation:burst2g 24s linear infinite}.b2h{animation:burst2h 24s linear infinite}
    .b3a{animation:burst3a 24s linear infinite}.b3b{animation:burst3b 24s linear infinite}.b3c{animation:burst3c 24s linear infinite}.b3d{animation:burst3d 24s linear infinite}
    .b3e{animation:burst3e 24s linear infinite}.b3f{animation:burst3f 24s linear infinite}.b3g{animation:burst3g 24s linear infinite}.b3h{animation:burst3h 24s linear infinite}
  </style>

  <!-- Background + noise -->
  <rect class="bg" width="100%" height="100%"/>
  <rect width="100%" height="100%" filter="url(#noise)" opacity="0.3"/>

  <!-- Crop marks -->
  <path class="crop" d="M 30 50 L 30 30 L 50 30"/>
  <path class="crop" d="M 1150 30 L 1170 30 L 1170 50" style="animation-delay:1s"/>
  <path class="crop" d="M 30 550 L 30 570 L 50 570" style="animation-delay:2s"/>
  <path class="crop" d="M 1150 570 L 1170 570 L 1170 550" style="animation-delay:3s"/>

  <!-- Center crosshair -->
  <line x1="595" y1="290" x2="605" y2="290" stroke="#e8e8e8" stroke-width="0.3" opacity="0.3"/>
  <line x1="600" y1="285" x2="600" y2="295" stroke="#e8e8e8" stroke-width="0.3" opacity="0.3"/>

  <!-- Ambient particles -->
  <g clip-path="url(#leftZone)">
    <circle class="particle p1" cx="120" cy="480" r="1"/>
    <circle class="particle p2" cx="200" cy="520" r="0.8"/>
  </g>

  <!-- Atmosphere -->
  <text x="40" y="48" class="atmos" font-size="9" letter-spacing="0.15em">AW26</text>

  <!-- Measurement scale -->
  <line x1="18" y1="100" x2="18" y2="500" stroke="#ececec" stroke-width="0.3"/>
  <line x1="15" y1="100" x2="21" y2="100" stroke="#ececec" stroke-width="0.3"/>
  <line x1="15" y1="200" x2="21" y2="200" stroke="#ececec" stroke-width="0.3"/>
  <line x1="15" y1="300" x2="21" y2="300" stroke="#ececec" stroke-width="0.3"/>
  <line x1="15" y1="400" x2="21" y2="400" stroke="#ececec" stroke-width="0.3"/>
  <line x1="15" y1="500" x2="21" y2="500" stroke="#ececec" stroke-width="0.3"/>

  <!-- ========== LEFT: TYPEWRITER INSIGHTS ========== -->

  <!-- Section label -->
  <line class="extLine" x1="55" y1="195" x2="330" y2="195"/>
  <text x="55" y="190" class="subLabel" font-size="9" letter-spacing="0.3em" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', monospace">THOUGHTS ON THE AI ERA</text>

  <!-- Insight 1 -->
  <text class="twText tw1" x="57" y="228">The best code is the one</text>

  <!-- Insight 2 -->
  <text class="twText tw2" x="57" y="273">Ship the prototype.</text>

  <!-- Insight 3 -->
  <text class="twText tw3" x="57" y="318">AI writes code.</text>

  <!-- Insight sub-lines (same cycle) -->
  <text class="twText tw1" x="57" y="248" style="font-size:14px;fill:#888888">you never write.</text>
  <text class="twText tw2" x="57" y="293" style="font-size:14px;fill:#888888">Kill the roadmap.</text>
  <text class="twText tw3" x="57" y="338" style="font-size:14px;fill:#888888">Humans write intent.</text>

  <!-- Typewriter cursor -->
  <rect class="twCursor" x="57" y="216" width="9" height="17" rx="1"/>

  <!-- Dissolve particles for insight 1 -->
  <g>
    <circle class="dp b1a" cx="100" cy="235" r="1.2"/><circle class="dp b1b" cx="170" cy="228" r="1"/>
    <circle class="dp b1c" cx="250" cy="240" r="1.3"/><circle class="dp b1d" cx="330" cy="232" r="0.9"/>
    <circle class="dp b1e" cx="140" cy="242" r="1.1"/><circle class="dp b1f" cx="380" cy="226" r="1"/>
    <circle class="dp b1g" cx="210" cy="245" r="1.2"/><circle class="dp b1h" cx="440" cy="235" r="0.8"/>
  </g>

  <!-- Dissolve particles for insight 2 -->
  <g>
    <circle class="dp b2a" cx="100" cy="280" r="1.2"/><circle class="dp b2b" cx="170" cy="273" r="1"/>
    <circle class="dp b2c" cx="250" cy="285" r="1.3"/><circle class="dp b2d" cx="330" cy="277" r="0.9"/>
    <circle class="dp b2e" cx="140" cy="287" r="1.1"/><circle class="dp b2f" cx="380" cy="271" r="1"/>
    <circle class="dp b2g" cx="210" cy="290" r="1.2"/><circle class="dp b2h" cx="440" cy="280" r="0.8"/>
  </g>

  <!-- Dissolve particles for insight 3 -->
  <g>
    <circle class="dp b3a" cx="100" cy="325" r="1.2"/><circle class="dp b3b" cx="170" cy="318" r="1"/>
    <circle class="dp b3c" cx="250" cy="330" r="1.3"/><circle class="dp b3d" cx="330" cy="322" r="0.9"/>
    <circle class="dp b3e" cx="140" cy="332" r="1.1"/><circle class="dp b3f" cx="380" cy="316" r="1"/>
    <circle class="dp b3g" cx="210" cy="335" r="1.2"/><circle class="dp b3h" cx="440" cy="325" r="0.8"/>
  </g>

  <!-- Bottom labels -->
  <text x="60" y="530" class="subLabel" font-size="10" letter-spacing="0.35em">DIGITAL ATELIER</text>
  <text x="60" y="550" class="subMono" font-size="9" letter-spacing="0.2em">EST. 2026</text>

  <!-- ========== RIGHT: SIGNATURE D1 MONOGRAM ========== -->
  <!-- Luxury calligraphic "D1" — sweeping italic strokes with flourish -->
  <g transform="translate(620, 60) scale(3.8)">
    <path class="sig" d="
      M 8,108
      C 8,108 6,95 8,75
      C 10,55 14,30 20,18
      C 26,6 35,2 48,4
      C 61,6 78,16 88,32
      C 98,48 102,70 100,88
      C 98,106 88,118 72,122
      C 56,126 38,120 24,112
      C 16,107 10,100 8,108
      Z
      M 30,30
      C 38,22 50,20 60,28
      C 70,36 76,52 76,68
      C 76,84 70,98 58,104
      C 46,110 34,106 28,96
      C 22,86 22,68 26,52
      C 28,42 30,34 30,30

      M 120,6
      C 118,4 116,2 120,2
      L 130,2
      C 132,2 132,4 130,6
      L 126,22
      L 126,100
      C 126,102 128,104 132,104
      L 142,104
      C 144,104 144,106 144,108
      L 144,112
      C 144,114 142,114 140,114
      L 112,114
      C 110,114 110,112 110,110
      L 110,108
      C 110,106 112,104 114,104
      L 122,104
      C 124,104 124,102 124,100
      L 124,22
      L 114,34
      C 112,36 110,34 110,32
      Z
    "/>
  </g>

  <!-- Monogram subtle underline flourish -->
  <line x1="680" y1="500" x2="1120" y2="500" stroke="#e0e0e0" stroke-width="0.5" opacity="0.3"/>

  <!-- Monogram edge glow -->
  <path class="monoEdge" d="M 650 300 C 650 200 700 100 800 80" stroke-width="1"/>

  <!-- Scanlines -->
  <rect class="scan" x="0" y="0" width="100%" height="1"/>
  <rect class="vscan" x="0" y="0" width="1" height="100%"/>
</svg>
